name: Release Sauron Harness

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sauron-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Test, and Publish Sauron Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript 7 Type Checking
        run: npx tsc --noEmit

      - name: Verify Zero Documentation Debt
        run: npm run check-docs -- --pre-push

      - name: Build Sauron Distribution
        run: npm run build

      - name: Execute Automated Test Suite
        run: npm test

      - name: Automated Semantic Tagging
        id: tagger
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          RELEASE_BRANCHES: main
          TAG_PREFIX: "sauron-v"

      - name: Package Sauron Distribution Bundle
        run: |
          zip -r sauron-harness.zip bin/ dist/ config/ skills/ adapters/ references/ core/ package.json README.md LICENSE -x "node_modules/*"

      - name: Create GitHub Release and Attach Bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.new_tag || github.ref_name }}
          name: Sauron Release ${{ steps.tagger.outputs.new_tag || github.ref_name }}
          generate_release_notes: true
          files: sauron-harness.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
