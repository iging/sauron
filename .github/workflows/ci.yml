name: Continuous Integration
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    name: Verify on Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
          - 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies strictly
        run: npm ci
      - name: Build engine
        run: npm run build
      - name: Run TypeScript type checking
        run: npx tsc --noEmit
      - name: Verify zero pending documentation debt
        run: npm run check-docs -- --pre-push
      - name: Execute automated test suite
        run: node --test tests/**/*.test.mjs
  windows-portable:
    name: Verify Windows portable zip
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies strictly
        run: npm ci
      - name: Build and typecheck
        run: |-
          npm run build
          npx tsc --noEmit
      - name: Run tests
        run: npm test
      - name: Verify release tag matches package
        shell: pwsh
        run: >-
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            if ($env:GITHUB_REF -cne "refs/tags/v$version") { throw "Tag and package version differ." }
          }
      - name: Build Windows portable zip
        run: node scripts/packaging/build-windows.mjs --out build/windows
      - name: Smoke test extracted zip without Node on PATH
        shell: pwsh
        run: >-
          $zip = @(Get-ChildItem -LiteralPath build/windows -Filter "*.zip")

          if ($zip.Count -ne 1) { throw "Expected one Windows zip." }

          node scripts/packaging/smoke-windows.mjs --archive $zip[0].FullName --work
          build/windows-smoke

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
