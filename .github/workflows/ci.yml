name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Quality, Security, and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js runtime
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies strictly
        run: npm ci || npm install --ignore-scripts

      - name: Run TypeScript type checking
        run: npx tsc --project tsconfig.json

      - name: Verify zero pending documentation debt
        run: npm run check-docs -- --pre-push

      - name: Execute automated test suite
        run: node --test tests/**/*.test.mjs
